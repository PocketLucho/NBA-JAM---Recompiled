# Builds on every pull request and push to main; packages and drafts a GitHub Release when a
# version tag (v*) is pushed. All the build logic lives in tools/ci/*.sh so it can be run
# by hand on any Ubuntu/WSL machine. No game data is used or produced anywhere in here.
name: build-and-release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Naming only; R1.2 puts the real version inside the program.
  PKG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  repo-check:
    name: No ROMs, archives or binaries in the repository
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ci/check_repo.py --self-test
      - run: python3 tools/ci/check_repo.py

  linux:
    name: Linux x64 (build, ROM-free Lua tests, package)
    runs-on: ubuntu-22.04      # oldest current runner: keeps the glibc requirement low
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags, for the version string

      - name: Build tools and SDL2 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zip \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libgl-dev

      - name: Cache SDL2 (pinned 2.30.9, built from the checked source tarball)
        uses: actions/cache@v4
        with:
          path: deps/sdl2linux
          key: sdl2-linux-${{ runner.os }}-${{ hashFiles('tools/ci/fetch_sdl.sh') }}

      - name: Fetch SDL2
        run: tools/ci/fetch_sdl.sh linux deps/sdl2linux

      - name: Build libcore, liblua, modtest, luatest and the app
        run: tools/ci/build_all.sh linux deps/sdl2linux build/NBAJamRecomp-linux

      - name: Lua engine tests (no ROM needed)
        run: |
          set -o pipefail
          build/linux/luatest | tee luatest.log
          grep -q ", 0 failed" luatest.log

      - name: Data folder tests (no ROM needed)
        run: |
          set -o pipefail
          build/linux/pathtest | tee pathtest.log
          grep -q ", 0 failed" pathtest.log

      - name: Release news tests (no network needed)
        run: |
          set -o pipefail
          build/linux/newstest | tee newstest.log
          grep -q ", 0 failed" newstest.log

      - name: Version string matches the tag
        run: |
          got=$(build/NBAJamRecomp-linux --version)
          echo "program says: $got"
          if [ "${{ github.ref_type }}" = tag ]; then
            want="${{ github.ref_name }}"; want="${want#v}"
            [ "$got" = "$want" ] || { echo "expected $want"; exit 1; }
          fi

      - name: Package
        run: tools/ci/package.sh linux build/NBAJamRecomp-linux "NBAJamRecomp-${PKG_VERSION}-linux-x64" dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist-out/*
          if-no-files-found: error

  windows:
    name: Windows x64 (cross-build, package)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags, for the version string

      - name: Install the MinGW-w64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential mingw-w64 zip

      - name: Cache SDL2 (pinned 2.30.9, official MinGW package)
        uses: actions/cache@v4
        with:
          path: deps/sdl2win
          key: sdl2-win-${{ hashFiles('tools/ci/fetch_sdl.sh') }}

      - name: Fetch SDL2
        run: tools/ci/fetch_sdl.sh win deps/sdl2win

      - name: Build libcore, liblua and NBAJamRecomp.exe
        run: tools/ci/build_all.sh win deps/sdl2win build/NBAJamRecomp.exe

      - name: Version string is in the executable
        run: |
          want=$(make -s print-version)
          echo "expecting: $want"
          strings build/NBAJamRecomp.exe | grep -Fx -- "$want"

      - name: Package
        run: tools/ci/package.sh windows build/NBAJamRecomp.exe "NBAJamRecomp-${PKG_VERSION}-windows-x64" dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-out/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [repo-check, linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write          # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # tags, to find the previous version

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Release page from the changelog
        run: |
          python3 tools/ci/release_notes.py --self-test
          python3 tools/ci/release_notes.py notes "${{ github.ref_name }}" -o release-notes.md
          cat release-notes.md

      - name: Checksums
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" --draft --verify-tag \
            --title "NBA JAM Recomp ${{ github.ref_name }}" \
            --notes-file release-notes.md
